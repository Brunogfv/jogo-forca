<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/css/style.css">

    <title>Descubra a Palavra</title>
</head>

<body>

    <div id="telaInicial">
        <h1>Jogo das Palavras</h1>
        <input type="text" id="nome" placeholder="Digite o seu nome: ">
        <button onclick="iniciarJogo()">Iniciar o Jogo</button>
    </div>

    <div id="jogo" style="display: none;">
        <h2 id="pontuacao">Pontos: 0</h2>
        <p id="palavra"></p>

        <input type="text" id="letra" maxlength="1">
        <button onclick="verificarLetra()">Tentar</button>

        <p id="letrasUsadas"></p>
        <p id="tentativas"></p>
        <p id="mensagem"></p>

        <button onclick="finalizarJogo()">Finalizar</button>
    </div>

    <h2>Ranking</h2>
    <ul id="ranking"></ul>
    <script src="/frontend/js/script.js"></script>
</body>

</html>
